name: ErinERP

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  ErinERP:
    type: application
    platform: iOS
    sources:
      - path: ErinERP
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erincom.erp
        PRODUCT_NAME: ErinERP
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: ErinERP/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: true
      testTargets:
        - ErinERPTests

  ErinERPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ErinERPTests
    dependencies:
      - target: ErinERP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erincom.erp.tests
        GENERATE_INFOPLIST_FILE: YES
