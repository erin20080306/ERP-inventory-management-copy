name: Publish ERP Host container image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "docker-compose.local.yml"
      - "updater/**"
      - "installer/**"
      - "prisma/**"
      - "src/**"
      - "public/**"
      - "scripts/verify-company-discovery.ts"
      - "scripts/verify-host-update.mjs"
      - "scripts/verify-installed-storefront-sync.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - ".github/workflows/release-desktop.yml"
      - ".github/workflows/publish-host-container-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-host-container-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: erin20080306/erp-inventory-management-copy

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Host release safeguards
        run: node scripts/verify-host-update.mjs
      - name: Build isolated updater sidecar
        run: docker build -t erin-erp-host-updater:test ./updater

  build-platform:
    needs: verify
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=艾琳 ERP 公司主機
            org.opencontainers.image.description=艾琳 ERP 本機公司主機映像
            org.opencontainers.image.source=https://github.com/erin20080306/ERP-inventory-management-copy
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            ERIN_RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=host-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=host-${{ matrix.arch }}

  build-and-push:
    needs: build-platform
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble candidate multi-platform manifest
        env:
          CANDIDATE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
        run: |
          set -eu
          docker buildx imagetools create --tag "$CANDIDATE_IMAGE" "${CANDIDATE_IMAGE}-amd64" "${CANDIDATE_IMAGE}-arm64"
      - name: Capture immutable candidate Digest
        id: manifest
        env:
          CANDIDATE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
        run: |
          set -eu
          manifest_json="$(docker buildx imagetools inspect "$CANDIDATE_IMAGE" --format '{{json .Manifest}}')"
          digest="$(printf '%s' "$manifest_json" | node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(0,"utf8")).digest; if(typeof value!=="string") process.exit(1); process.stdout.write(value)')"
          case "$digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "Invalid candidate digest: $digest" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Candidate digest: $digest"
      - name: Verify candidate multi-platform manifest by Digest
        env:
          IMMUTABLE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -eu
          docker buildx imagetools inspect "$IMMUTABLE_IMAGE" | tee /tmp/erin-erp-candidate-manifest.txt
          grep -q "linux/amd64" /tmp/erin-erp-candidate-manifest.txt
          grep -q "linux/arm64" /tmp/erin-erp-candidate-manifest.txt
      - name: Smoke test Apple Silicon Host startup
        env:
          ERP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          COMPOSE_PROJECT_NAME: erinerp-smoke-${{ github.run_id }}
        run: |
          set -eu
          cp docker/Caddyfile Caddyfile
          ENV_FILE=/tmp/erin-erp-smoke.env
          cat > "$ENV_FILE" <<EOF
          ERP_HTTPS_PORT=3443
          SERVER_HOST=127.0.0.1
          ERP_IMAGE=$ERP_IMAGE
          POSTGRES_PASSWORD=github-actions-postgres-password
          NEXTAUTH_URL=https://127.0.0.1:3443
          NEXTAUTH_SECRET=github-actions-nextauth-secret-at-least-32-characters
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=GithubActions1234
          ADMIN_EMAIL=local-admin@erin-erp.local
          COMPANY_NAME=GitHub Actions
          BUSINESS_MODE=ERP
          CENTRAL_LICENSE_URL=https://example.invalid
          LOCAL_ACTIVATION_KEY=github-actions-local-activation-key
          LOCAL_DEVICE_ID=github-actions-arm64
          LOCAL_DEVICE_NAME=GitHub-Actions
          LOCAL_INSTALLER_TOKEN=github-actions-installer-token
          HOST_UPDATE_TOKEN=github-actions-host-update-token-at-least-32-characters
          HOST_BACKUP_DIR=/tmp/erin-erp-smoke-backups
          BACKUP_ENCRYPTION_KEY=github-actions-backup-encryption-key
          BACKUP_RETENTION_DAYS=30
          BACKUP_INTERVAL_HOURS=24
          LICENSE_ED25519_PUBLIC_KEY_B64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          INTEGRITY_SECRET=github-actions-integrity-secret-at-least-32-characters
          EINVOICE_PROVIDER=
          EINVOICE_ALLOW_MOCK=false
          EINVOICE_ENV=TEST
          EINVOICE_MIG_VERSION=4.1
          EINVOICE_SELLER_TAX_ID=
          EINVOICE_TURNKEY_OUTBOX_DIR=
          EINVOICE_TURNKEY_ACK_DIR=
          EINVOICE_VAN_NAME=
          EINVOICE_VAN_BASE_URL=
          EINVOICE_VAN_CLIENT_ID=
          EINVOICE_VAN_CLIENT_SECRET=
          EOF
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              docker compose --env-file "$ENV_FILE" -f docker-compose.local.yml ps || true
              docker compose --env-file "$ENV_FILE" -f docker-compose.local.yml logs --no-color --tail=200 postgres app caddy || true
            fi
            docker compose --env-file "$ENV_FILE" -f docker-compose.local.yml down -v --remove-orphans || true
          }
          trap cleanup EXIT
          DOCKER_DEFAULT_PLATFORM=linux/arm64 docker compose --env-file "$ENV_FILE" -f docker-compose.local.yml up -d postgres app caddy
          for attempt in $(seq 1 90); do
            if curl -kfsS https://127.0.0.1:3443/login >/dev/null; then
              echo "Apple Silicon Host became ready after $((attempt * 2)) seconds."
              exit 0
            fi
            sleep 2
          done
          echo "Apple Silicon Host did not become ready within 180 seconds." >&2
          exit 1
      - name: Check candidate is still current main
        id: freshness
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" = "$RELEASE_SHA" ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; this verified candidate will not replace latest."
          fi
      - name: Promote verified Digest to latest compatibility tag
        if: steps.freshness.outputs.promote == 'true'
        env:
          VERIFIED_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          LATEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: docker buildx imagetools create --tag "$LATEST_IMAGE" "$VERIFIED_IMAGE"
      - name: Verify promoted latest points to the released manifest
        if: steps.freshness.outputs.promote == 'true'
        env:
          RELEASE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -eu
          manifest_json="$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:latest" --format '{{json .Manifest}}')"
          latest_digest="$(printf '%s' "$manifest_json" | node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(0,"utf8")).digest; if(typeof value!=="string") process.exit(1); process.stdout.write(value)')"
          test "$latest_digest" = "$RELEASE_DIGEST"
      - name: Record released Host image version and Digest
        if: steps.freshness.outputs.promote == 'true' && github.ref == 'refs/heads/main'
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -eu
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]; then
            echo "Main advanced before release recording; skip the stale marker."
            exit 0
          fi
          git checkout -B main origin/main
          published_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          mkdir -p src/generated
          printf '%s\n' \
            '// This file is advanced only after the multi-platform Host image passes its smoke test.' \
            'export const CURRENT_HOST_RELEASE = {' \
            "  version: \"$RELEASE_SHA\"," \
            "  digest: \"$RELEASE_DIGEST\"," \
            "  publishedAt: \"$published_at\"," \
            '} as const;' > src/generated/current-host-release.ts
          if git diff --quiet -- src/generated/current-host-release.ts; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/generated/current-host-release.ts
          git commit -m "chore: record Host image $RELEASE_SHA $RELEASE_DIGEST [skip ci]"
          git push origin HEAD:main
      - name: Show published Host image
        if: steps.freshness.outputs.promote == 'true'
        run: |
          echo "Verified compatibility tag: ghcr.io/${IMAGE_NAME}:latest"
          echo "Immutable release: ghcr.io/${IMAGE_NAME}@${{ steps.manifest.outputs.digest }}"
      - name: Show superseded candidate result
        if: steps.freshness.outputs.promote != 'true'
        run: echo "Candidate passed tests but was superseded by a newer main commit."
