name: Build local ERP image and installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      host_only:
        description: "只發布三種內含 ERP 映像的手動 Host ZIP"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: github-actions-only-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:rehearse
      - run: npm run test:fulfillment
      - run: npm run test:pos
      - run: npm run test:pos-hardware
      - run: npm run test:pos-offers
      - run: npm run test:pos-restaurant
      - run: npm run test:pos-medical
      - run: npm run test:commerce
      - run: npm run test:storefront
      - run: npm run test:installed-storefront
      - run: npm run test:storefront-host-sync
      - run: npm run test:storefront-members
      - run: npm run test:company-profile
      - run: npm run test:speed
      - run: npm run test:pos-recovery
      - run: npm run test:backup
      - run: npm run test:einvoice
      - run: npm run test:commercial
      - run: npm run test:commercial-contact
      - run: npm run test:accounting
      - run: npm run test:resilience
      - run: npm run test:release
      - run: npm run test:desktop
      - run: npm run test:update
      - run: npm run test:discovery
      - run: npx tsc --noEmit
      - run: npm run build

  host-images:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build native bundled ERP Host image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: erin-erp-host-bundle:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            ERIN_RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=bundled-host-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bundled-host-${{ matrix.arch }}
      - name: Export compressed ERP Host image
        run: |
          set -eu
          mkdir -p dist/host-image
          docker image save "erin-erp-host-bundle:${GITHUB_SHA}-${{ matrix.arch }}" \
            | gzip -1 > "dist/host-image/erin-erp-host-image-${{ matrix.arch }}.tar.gz"
          test -s "dist/host-image/erin-erp-host-image-${{ matrix.arch }}.tar.gz"
          sha256sum "dist/host-image/erin-erp-host-image-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: host-image-${{ matrix.arch }}
          path: dist/host-image/erin-erp-host-image-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 3

  host-installers:
    needs: host-images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: host-image-amd64
          path: dist/host-images/amd64
      - uses: actions/download-artifact@v4
        with:
          name: host-image-arm64
          path: dist/host-images/arm64
      - name: Package three manual Host installers with images
        env:
          ERIN_RELEASE_SHA: ${{ github.sha }}
          ERIN_HOST_IMAGE_AMD64_ARCHIVE: dist/host-images/amd64/erin-erp-host-image-amd64.tar.gz
          ERIN_HOST_IMAGE_ARM64_ARCHIVE: dist/host-images/arm64/erin-erp-host-image-arm64.tar.gz
          ERIN_HOST_IMAGE_AMD64_TAG: erin-erp-host-bundle:${{ github.sha }}-amd64
          ERIN_HOST_IMAGE_ARM64_TAG: erin-erp-host-bundle:${{ github.sha }}-arm64
        run: node scripts/build-host-installers.mjs "${GITHUB_REF_NAME}"
      - name: Verify bundled package names, images and instructions
        run: |
          set -eu
          WIN="$(echo dist/desktop/ErinERP-Host-Windows-x64-*.zip)"
          ARM="$(echo dist/desktop/ErinERP-Host-macOS-Apple-Silicon-*.zip)"
          INTEL="$(echo dist/desktop/ErinERP-Host-macOS-Intel-*.zip)"
          test -f "$WIN"
          test -f "$ARM"
          test -f "$INTEL"
          test "$(unzip -p "$WIN" bundle-arch.txt | tr -d '\r\n')" = "amd64"
          test "$(unzip -p "$ARM" bundle-arch.txt | tr -d '\r\n')" = "arm64"
          test "$(unzip -p "$INTEL" bundle-arch.txt | tr -d '\r\n')" = "amd64"
          for package in "$WIN" "$ARM" "$INTEL"; do
            unzip -l "$package" | grep -q "images/erin-erp-host-image.tar.gz"
            unzip -l "$package" | grep -q "安裝說明.txt"
            unzip -p "$package" 安裝說明.txt | grep -q "輸入艾琳設計提供的啟用碼"
            unzip -p "$package" 安裝說明.txt | grep -q "自動顯示提示並開啟 Docker 官方安裝頁"
            size="$(stat -c%s "$package")"
            test "$size" -lt 1900000000
          done
          unzip -p "$ARM" installer/Install-ErinERP.command > /tmp/Install-ErinERP-arm64.command
          unzip -p "$INTEL" installer/Install-ErinERP.command > /tmp/Install-ErinERP-intel.command
          bash -n /tmp/Install-ErinERP-arm64.command
          bash -n /tmp/Install-ErinERP-intel.command
          unzip -p "$WIN" installer/Install-ErinERP.ps1 > /tmp/Install-ErinERP.ps1
      - name: Verify generated Windows PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('/tmp/Install-ErinERP.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: local-server-installers
          path: dist/desktop/ErinERP-Host-*.zip
          compression-level: 0
          retention-days: 3

  desktop-clients:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.host_only)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: desktop-macos
          - os: windows-latest
            artifact: desktop-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm --prefix desktop ci
      - name: Require Apple signing and notarization secrets
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - name: Require Windows code-signing secrets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK) { throw "Missing WIN_CSC_LINK" }
          if (-not $env:CSC_KEY_PASSWORD) { throw "Missing CSC_KEY_PASSWORD" }
      - name: Build signed and notarized macOS clients
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm --prefix desktop run dist:mac -- --x64 --arm64
      - name: Build signed Windows client
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm --prefix desktop run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.exe
          if-no-files-found: error

  host-release:
    needs: host-installers
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'workflow_dispatch' && inputs.host_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-server-installers
          path: release-assets
      - name: Generate Host release manifest and SHA-256 checksums
        run: node scripts/write-release-manifest.mjs release-assets "${GITHUB_REF_NAME}"
      - name: Attach three bundled manual Host installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber

  release:
    needs: [host-installers, desktop-clients]
    if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.host_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate signed release manifest and SHA-256 checksums
        env:
          RELEASE_SIGNED: "true"
        run: node scripts/write-release-manifest.mjs release-assets "${GITHUB_REF_NAME}"
      - name: Attach tested installers and native clients to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
