name: ERP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_ci?schema=public
      NEXTAUTH_SECRET: github-actions-ci-secret-at-least-32-characters
      LOCAL_LICENSE_MODE: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Verify release, update and regression safeguards
        run: node scripts/verify-ci-release.mjs && npm run test:speed && npm run test:release && npm run test:update && npm run test:desktop

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Check committed patch formatting
        run: git diff --check
